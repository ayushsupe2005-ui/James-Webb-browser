    <script>
  //This webapp is a collaboration between AS and RR
    console.log("This webapp is a collaboration between AS and RR"); 
    /*declare variables*/
    var answerIndex; 
    var clicked; 
    var qtimer; 
    var ctimer; 
    var timeInSeconds = 5; 
    var playerMove = 10; 
    var move = 10; 
    var answerList = []; 
    var problemList = []; 
    function timer()
    {
    	timeInSeconds -= 1; 
    	document.getElementById("questionTimer").innerHTML = "You have " + timeInSeconds + " seconds"; 
    	//console.log(timeInSeconds); 
    	if(document.getElementById("questionTimer").innerHTML == "You have 0 seconds")
    	{
    		clearInterval(qtimer); 
    		timeInSeconds = 5; 
    		setTimeout(generateOptions(randomProblem(), randomNumber(5) + 1), 1000); 
    		qtimer = setInterval(timer, 1000);
    	}; 
    }
    /*function from MDN web docs https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/random*/
    function randomNumber(max)
    	{
    		return String(Math.floor(Math.random() * max)); 
    	}
    function randomSign()
    	{
    		randInt = randomNumber(100); 
    		if(randInt <= 25)
    		{
    			return "+"; 
    		}
    		else if(randInt <= 50)
    		{
    			return "-"; 
    		}
    		else if(randInt <= 75)
    		{
    			return "*"; 
    		}
    		else
    		{
    			return "/"; 
    		}
    	}
    function randomProblem()
    	{
    		problem = randomNumber(100) + randomSign() + randomNumber(100); 
    		document.getElementById("problemText").innerHTML = problem; 
    		return problem + "=" + math.compile(problem).evaluate(); 
    	}
    function generateOptions(problemAnswer, randomMethodNumber)
    	{
    		if(randomMethodNumber == 0)
    		{
    			randomMethodNumber = randomNumber(4); 
    		}
    		problem = problemAnswer.slice(0, problemAnswer.indexOf("=")); 
    		//console.log(problem); 
    		problemList.push(problemAnswer); 
    		answer = parseInt(problemAnswer.slice(problemAnswer.indexOf("=") + 1)); 
    		//console.log(answer); 
    		answerList.push(answer); 
    		var choices = [answer.toPrecision(3), randomNumber(100) + randomMethodNumber, (randomMethodNumber % answer).toPrecision(3), answer * 3.14 * randomNumber(4) + randomMethodNumber]; 
    		//console.log(choices); 
    		for(var s = 0; s < randomNumber(100); s++)
    			{
    				var randomIndex1 = randomNumber(4); 
    				var randomIndex2 = randomNumber(4); 
    				if(randomIndex1 === randomIndex2)
    				{
    					continue; 
    				}
    				var itemToMove1 = choices[randomIndex1]
    				var itemToMove2 = choices[randomIndex2]
    				choices[randomIndex1] = itemToMove2; 
    				choices[randomIndex2] = itemToMove1; 
    			}
    		//console.log(choices); 
    		for(var z = 0; z < choices.length; z++)
    			{
    				document.getElementById("option" + z).innerHTML = choices[z]; 
    			}
    		answerIndex = choices.indexOf(answer.toPrecision(3)); 
    		//console.log(answerIndex); 
    	}
    function moveComputerCar()
    	{	
    		move += 5; 	document.getElementById("computerCar").setAttribute('x', move); 
    		//console.log(move); 
    		if(move >= 420)
    		{
    			clearInterval(ctimer); 
    			win("Computer"); 
    		}
    		if(playerMove >= 420)
    		{
    			clearInterval(ctimer); 
    			win("Player"); 
    		}
    	}
    function win(winner)
    {
    	document.getElementById('winText').style.visibility = 'visible';
    	document.getElementById('winText').innerHTML = winner + ' Wins!'; 
    	document.getElementById('option0').style.visibility = 'hidden'; 	
    	document.getElementById('option1').style.visibility = 'hidden'; 	
    	document.getElementById('option2').style.visibility = 'hidden'; 	
    	document.getElementById('option3').style.visibility = 'hidden'; 	
    	document.getElementById("questionTimer").style.visibility = "hidden"; 
    	clearInterval(qtimer); 
    	document.getElementById("problemText").innerHTML = "Scroll down to see the problems and answers";
    	document.getElementById("problemText").style.fontSize = 13; 
    	document.getElementById("problemList").innerHTML = "problems: " + problemList; 
    	document.getElementById("answerList").innerHTML = "answers: " + answerList; 
    		}
     
    console.log("# Game description"); 

    console.log("Do math problems to advance your car before the other car gets to the finishing line!"); 

    console.log("## Game rules"); 

    console.log("### Math problems"); 

    console.log("Each problem is randomized and the numbers are similar to the answer. "); 

    console.log("Each problem must be done under 5 seconds or you will miss an opportunity to advance your car. "); 

    console.log("If you get a question wrong, then it will move on to the next question without advancing your car. "); 

    console.log("The problems will include addition, subtraction, multiplication, and division. "); 

    console.log("There will be another car that will be racing alongside your car. This car will go at a constant speed. "); 

    console.log("The problems will vary from multiplication, division, addition, and/or subtraction. ");
